appId: com.claudecodegui.app
productName: Claude Code GUI
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

npmRebuild: false

files:
  - out/**/*
  - "!node_modules/**/*"
  - node_modules/**/*.node
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/@xenova/**/*

asar: true

asarUnpack:
  - "node_modules/node-pty/**"

# ============================================
# Windows
# ============================================

win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-x64.${ext}

# ============================================
# macOS
# ============================================

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.developer-tools

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# ============================================
# Linux
# ============================================

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icons
  category: Development
  maintainer: claude-code-gui@example.com
  synopsis: Multi-Agent AI Coding Assistant
  description: Desktop GUI for AI-powered coding with 20-agent cluster

appImage:
  artifactName: ${productName}-${version}-linux-x64.${ext}

deb:
  artifactName: ${productName}-${version}-linux-amd64.${ext}

rpm:
  artifactName: ${productName}-${version}-linux-x86_64.${ext}

# ============================================
# Publish — multi-provider
# ============================================

